<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>תאוריה בקל</title>
    <meta name="description" content="לימוד תיאוריה לרישיון B על בסיס המאגר הרשמי של משרד התחבורה" />
    <meta name="theme-color" content="#0a2a7a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="תאוריה בקל" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Heebo:wght@400;500;700;800&display=swap" />
  </head>
  <body>
    <style>
      #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(120% 80% at 50% 30%,#1b4fc4 0%,#0a2a7a 55%,#061a4d 100%);color:#fff;overflow:hidden;
        font-family:"Fredoka","Heebo",system-ui,sans-serif;transition:opacity .45s ease,transform .45s ease;direction:rtl}
      #splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
      #splash .sp-road{position:absolute;left:0;right:0;bottom:22%;height:6px;
        background:repeating-linear-gradient(90deg,#ffd23f 0 34px,transparent 34px 68px);opacity:.55;animation:sp-road 1s linear infinite}
      #splash .sp-glow{position:absolute;width:320px;height:320px;border-radius:50%;background:#4a95ee;filter:blur(70px);opacity:.35;animation:sp-pulse 2.2s ease-in-out infinite}
      #splash img{position:relative;width:132px;height:132px;border-radius:30px;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.12);
        animation:sp-pop .7s cubic-bezier(.2,1.4,.4,1) both}
      #splash h1{position:relative;margin:0;font-size:38px;font-weight:700;letter-spacing:.01em;animation:sp-up .55s .25s both}
      #splash .sp-lights{position:relative;display:flex;gap:10px;direction:ltr;animation:sp-up .5s .45s both}
      #splash .sp-lights i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
      #splash .sp-lights i:nth-child(1){animation:sp-r 1.8s .5s both}
      #splash .sp-lights i:nth-child(2){animation:sp-y 1.8s .5s both}
      #splash .sp-lights i:nth-child(3){animation:sp-g 1.8s .5s both}
      #splash .sp-by{position:absolute;bottom:calc(9% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;direction:ltr;
        font-size:19px;font-weight:600;letter-spacing:.14em;animation:sp-by .8s .7s both}
      #splash .sp-by b{font-weight:700;background:linear-gradient(90deg,#ffd23f,#fff,#ffd23f);background-size:200% 100%;
        -webkit-background-clip:text;background-clip:text;color:transparent;animation:sp-shine 1.6s .9s linear infinite}
      @keyframes sp-pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
      @keyframes sp-up{from{transform:translateY(16px);opacity:0}}
      @keyframes sp-by{from{letter-spacing:.5em;opacity:0}}
      @keyframes sp-shine{to{background-position:-200% 0}}
      @keyframes sp-road{to{background-position:68px 0}}
      @keyframes sp-pulse{50%{transform:scale(1.2);opacity:.5}}
      @keyframes sp-r{0%,30%{background:#ff4545;box-shadow:0 0 14px #ff4545}34%,100%{background:rgba(255,255,255,.18);box-shadow:none}}
      @keyframes sp-y{0%,30%{background:rgba(255,255,255,.18)}34%,62%{background:#ffbf2e;box-shadow:0 0 14px #ffbf2e}66%,100%{background:rgba(255,255,255,.18);box-shadow:none}}
      @keyframes sp-g{0%,62%{background:rgba(255,255,255,.18)}66%,100%{background:#34d460;box-shadow:0 0 16px #34d460}}
      @media (prefers-reduced-motion: reduce){#splash *{animation:none!important}#splash .sp-lights i:nth-child(3){background:#34d460}}
    </style>
    <div id="splash" aria-label="תאוריה בקל, By Orian Tamar">
      <div class="sp-glow"></div>
      <div class="sp-road"></div>
      <img src="icons/icon-192.png" alt="" width="132" height="132" />
      <h1>תאוריה בקל</h1>
      <div class="sp-lights"><i></i><i></i><i></i></div>
      <div class="sp-by">By <b>Orian Tamar</b></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
