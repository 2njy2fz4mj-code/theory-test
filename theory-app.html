<title>תיאוריה עם רמזי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="רמזי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* Layout: one phone column. Top status strip (streak · XP · daily goal), a scrolling road-map of lessons, a bottom tab bar.
   Lessons and the test simulation open as full-screen sheets on top. */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface-2:#eef3f9; --ink:#18232f; --muted:#5f6f84; --line:#dfe6ef;
  --blue:#1769d1; --blue-d:#0f53a8; --blue-bg:#e3effd;
  --green:#22a447; --green-d:#178236; --green-bg:#dcf6e2; --green-ink:#146b2c;
  --red:#e0464b; --red-d:#b8343a; --red-bg:#fde5e5; --red-ink:#a3282e;
  --amber:#f2a516; --amber-d:#c98407; --amber-bg:#fff2d4; --amber-ink:#875800;
  --teal:#0f9f95; --teal-d:#0b7c74; --slate:#3c4a5c; --slate-d:#283442;
  --kw-bg:#ffeab0; --scrim:rgba(10,18,30,.45);
  --font-display:"Fredoka","Heebo",system-ui,sans-serif;
  --font-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141d; --surface:#172130; --surface-2:#1d2939; --ink:#e9eef5; --muted:#97a6ba; --line:#2a374b;
  --blue:#4a95ee; --blue-d:#2f73c4; --blue-bg:#15263d;
  --green:#36b95a; --green-d:#23893f; --green-bg:#12301e; --green-ink:#86e7a0;
  --red:#ec5f64; --red-d:#b63c41; --red-bg:#3a1a1d; --red-ink:#ffa3a6;
  --amber:#f5b335; --amber-d:#c48712; --amber-bg:#33270f; --amber-ink:#ffd27a;
  --teal:#22b5aa; --teal-d:#168a82; --slate:#62748b; --slate-d:#44536a;
  --kw-bg:#4b3b0f; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141d; --surface:#172130; --surface-2:#1d2939; --ink:#e9eef5; --muted:#97a6ba; --line:#2a374b;
  --blue:#4a95ee; --blue-d:#2f73c4; --blue-bg:#15263d;
  --green:#36b95a; --green-d:#23893f; --green-bg:#12301e; --green-ink:#86e7a0;
  --red:#ec5f64; --red-d:#b63c41; --red-bg:#3a1a1d; --red-ink:#ffa3a6;
  --amber:#f5b335; --amber-d:#c48712; --amber-bg:#33270f; --amber-ink:#ffd27a;
  --teal:#22b5aa; --teal-d:#168a82; --slate:#62748b; --slate-d:#44536a;
  --kw-bg:#4b3b0f; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;direction:rtl;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.25}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
/* top strip */
.top{display:flex;align-items:center;gap:14px;padding-block:12px;border-bottom:2px solid var(--line);background:var(--bg)}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.stat.streak{color:var(--muted)}
.stat.streak.on{color:var(--amber-d)}
.stat.streak svg{width:26px;height:26px}
.stat.streak:not(.on) svg path{fill:var(--line)}
.xp-chip{background:var(--amber);color:#3a2700;border-radius:9px;font-size:12px;font-weight:700;padding:4px 7px;box-shadow:0 3px 0 var(--amber-d);letter-spacing:.04em}
.stat.xp{color:var(--amber-d)}
.goal{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.goal-txt{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--green);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);position:relative}
.bar .fill::after{content:"";position:absolute;inset:3px 8px auto 8px;height:3px;border-radius:9px;background:rgba(255,255,255,.35)}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{padding-block:18px 32px;display:flex;flex-direction:column;gap:20px}

/* bottom nav */
nav.tabs{display:flex;justify-content:space-around;border-top:2px solid var(--line);background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:2px solid transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:var(--muted);font-weight:600;font-size:13px;min-width:70px}
.tab svg{width:28px;height:28px}
.tab[aria-current="page"]{color:var(--blue);border-color:var(--blue);background:var(--blue-bg)}

/* buttons */
.btn{border:0;border-radius:16px;padding:15px 18px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.01em;width:100%;transition:transform .08s,box-shadow .08s,filter .15s;position:relative;top:0}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none!important}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.btn-ghost{background:transparent;color:var(--blue);box-shadow:none}
.btn-ghost.danger{color:var(--red)}
.btn-outline{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* bubble + mascot */
.coach{display:flex;flex-direction:column;align-items:center;gap:4px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:16px;max-width:420px;box-shadow:0 3px 0 var(--line)}
.bubble small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;width:14px;height:14px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.mascot{display:block}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* readiness card */
.ready{display:flex;align-items:center;gap:14px;background:var(--blue-bg);border:2px solid var(--blue);border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 0 var(--blue)}
.ready-ring{flex:none;width:68px;height:68px}
.ready h3{font-size:19px}
.ready p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ready > div{min-width:0}

/* path */
.unit{display:flex;flex-direction:column;gap:6px}
.unit-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--uc);color:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 0 var(--ucd)}
.unit-head > div{min-width:0}
.unit-eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.85}
.unit-head h2{font-size:21px}
.unit-head p{margin:0;font-size:14px;opacity:.9}
.unit-count{flex:none;font-family:var(--font-display);font-weight:700;background:rgba(255,255,255,.2);border-radius:12px;padding:6px 10px;font-variant-numeric:tabular-nums}
.nodes{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:22px 10px;position:relative}
.node-row{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:76px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--uc);box-shadow:0 7px 0 var(--ucd);color:#fff;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ucd)}
.node svg{width:34px;height:34px}
.node.done{background:var(--amber);box-shadow:0 7px 0 var(--amber-d);color:#5a3a00}
.node.locked{background:var(--line);box-shadow:0 7px 0 var(--muted);color:var(--muted);opacity:.85}
.node.review{border-radius:22px}
.node-label{font-size:14px;font-weight:600;color:var(--muted)}
.node-row.current .node{outline:6px solid color-mix(in srgb,var(--uc) 25%,transparent);outline-offset:4px}
.start-tip{position:absolute;bottom:calc(100% + 10px);background:var(--surface);color:var(--uc);border:2px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:17px;padding:6px 16px;border-radius:14px;white-space:nowrap;animation:tip 1.6s ease-in-out infinite;box-shadow:0 3px 0 var(--line)}
.start-tip::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes tip{50%{transform:translateY(-4px)}}
.side-mascot{position:absolute;top:50%;transform:translateY(-50%)}

/* cards & lists */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 4px 0 var(--line)}
.section-title{font-size:22px}
.muted{color:var(--muted)}
.mode{display:flex;align-items:center;gap:14px;text-align:start;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.mode:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 4px 0 var(--blue)}
.mode:disabled{opacity:.55;cursor:default}
.mode > div{flex:1;min-width:0}
.mode b{display:block;font-family:var(--font-display);font-size:18px}
.mode span{font-size:14px;color:var(--muted)}
.mode-ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--line)}
.mode-ico svg{width:28px;height:28px}
.check-dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.mode[aria-pressed="true"] .check-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);box-shadow:0 3px 0 var(--blue)}
.stack{display:flex;flex-direction:column;gap:12px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:var(--r);padding:14px;text-align:center;border:2px solid var(--tc);background:var(--tb);box-shadow:0 4px 0 var(--tc);display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .big{font-family:var(--font-display);font-weight:700;font-size:32px;color:var(--tc);font-variant-numeric:tabular-nums;line-height:1.1}
.tile b{font-size:15px}
.tile small{color:var(--muted);font-size:13px}
.hist{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.hist:last-child{border-bottom:0}
.pill{font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px}
.pill.pass{background:var(--green-bg);color:var(--green-ink)}
.pill.fail{background:var(--red-bg);color:var(--red-ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{right:25px}
.name-input{font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
.hero{background:var(--blue-bg);border-radius:var(--r);padding:18px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero h1{font-size:25px}
.linkish{background:none;border:0;color:var(--blue);font-weight:700;padding:4px}

/* ===== lesson / exam sheets ===== */
.sheet-screen{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet-inner{width:100%;max-width:560px;display:flex;flex-direction:column;height:100%}
.ls-top{display:flex;align-items:center;gap:14px;padding-block:14px 8px}
.ls-top .bar{flex:1;height:16px}
.icon-btn{background:none;border:0;padding:4px;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.icon-btn svg{width:28px;height:28px}
.combo{font-family:var(--font-display);font-weight:700;color:var(--amber-d);display:flex;align-items:center;gap:2px;font-size:17px;min-width:44px}
.combo svg{width:20px;height:20px}
.ls-body{flex:1;overflow-y:auto;padding-block:6px 20px;display:flex;flex-direction:column;gap:16px}
.ls-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:2px solid var(--line);font-weight:700;font-size:15px}
.ls-unit{color:var(--amber-d)}
.ls-count{color:var(--muted);font-variant-numeric:tabular-nums}
.again{font-size:12px;background:var(--amber-bg);color:var(--amber-ink);border-radius:99px;padding:2px 9px;margin-inline-start:6px}
.visual{align-self:center;width:150px;height:150px;background:var(--surface-2);border-radius:24px;display:grid;place-items:center;padding:14px}
.visual svg{width:100%;height:100%}
.visual.wide{width:min(100%,300px);height:150px}
.ls-q{font-family:var(--font-body);font-weight:800;font-size:23px;line-height:1.4}
mark.kw{background:var(--kw-bg);color:inherit;border-radius:6px;padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.tool svg{width:18px;height:18px}
.tool:disabled{opacity:.5}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:18px;box-shadow:0 4px 0 var(--line);transition:transform .08s,background .15s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .num{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.opt span:last-child{min-width:0}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 4px 0 var(--blue)}
.opt.sel .num{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-bg);box-shadow:0 4px 0 var(--green)}
.opt.right .num{border-color:var(--green);color:var(--green-ink)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);box-shadow:0 4px 0 var(--red)}
.opt.wrong .num{border-color:var(--red);color:var(--red-ink)}
.opt.gone{opacity:.3;text-decoration:line-through}
.opt:disabled{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ls-foot{padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.fb-in{width:100%;max-width:560px;border-radius:26px 26px 0 0;padding-block:20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow-y:auto}
.fb.ok .fb-in{background:var(--green-bg);color:var(--green-ink)}
.fb.bad .fb-in{background:var(--red-bg);color:var(--red-ink)}
.fb-head{display:flex;align-items:center;gap:12px}
.fb-ico{flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.fb-ico svg{width:30px;height:30px}
.fb-head h3{font-size:23px}
.fb p{margin:0;font-size:17px}
.fb .more-btn{background:none;border:0;color:inherit;font-weight:800;display:flex;align-items:center;gap:4px;padding:2px 0;font-size:16px}
.fb .more-btn svg{width:18px;height:18px;transition:transform .2s}
.fb .more-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.fb .more{font-size:16px;color:var(--ink);background:var(--surface);border-radius:14px;padding:12px 14px}
.fb .note{font-size:14px;opacity:.9}
.fb .btn{margin-top:6px}

/* complete */
.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:20px}
.done-screen h1{font-size:30px;color:var(--amber-d)}
.done-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.dt{border:2px solid var(--tc);border-radius:16px;overflow:hidden}
.dt b{display:block;background:var(--tc);color:#fff;font-size:13px;padding:4px}
.dt div{font-family:var(--font-display);font-weight:700;font-size:24px;padding:10px 4px;color:var(--tc);font-variant-numeric:tabular-nums}

/* exam */
.timer{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:18px;background:var(--surface-2);border-radius:99px;padding:5px 12px;font-variant-numeric:tabular-nums}
.timer svg{width:18px;height:18px}
.timer.low{background:var(--red-bg);color:var(--red-ink)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dot{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.ans{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.dot.cur{outline:3px solid var(--amber);outline-offset:1px}
.ex-nav{display:flex;gap:10px}
.ex-nav .btn{flex:1}
.result-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.result-hero h1{font-size:30px}
.result-hero.pass h1{color:var(--green)}
.result-hero.fail h1{color:var(--red)}
.score{font-family:var(--font-display);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.mistake{display:flex;flex-direction:column;gap:6px}
.mistake .q{font-weight:700}
.mistake .a{font-size:15px}
.mistake .a.bad{color:var(--red-ink)}
.mistake .a.good{color:var(--green-ink)}
.mistake .why{font-size:14px;color:var(--muted)}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.dialog{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;text-align:center;animation:up .22s}
.dialog h3{font-size:22px}
.dialog p{margin:0 0 6px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}

const Q=[
/* u1 */
{id:'a1',u:'u1',v:'tl-red',q:'מה עושים כשהרמזור **אדום**?',o:['עוצרים לפני קו העצירה ומחכים לירוק','מאטים ועוברים בזהירות','עוברים אם אין רכבים בצומת','צופרים וממשיכים'],why:'אדום = עצירה מלאה לפני קו העצירה.',more:'גם אם הצומת נראה ריק, אסור להיכנס באדום. מחכים עד שהרמזור מתחלף לירוק, ורק אז ממשיכים אחרי שבודקים שהצומת פנוי.'},
{id:'a2',u:'u1',v:'tl-yellow',q:'הרמזור מתחלף ל**צהוב** כשאתם מתקרבים לצומת. מה נכון?',o:['עוצרים, אלא אם אי אפשר לעצור בבטחה','מאיצים כדי להספיק','צהוב זה כמו ירוק, ממשיכים','צופרים כדי להזהיר אחרים'],why:'צהוב אומר "עוד רגע אדום": עוצרים אם אפשר לעשות זאת בבטחה.',more:'אם אתם כבר קרובים מאוד לקו העצירה ועצירה חדה תסכן אתכם או את מי שמאחוריכם, ממשיכים בזהירות. בכל מקרה אחר, עוצרים. אף פעם לא מאיצים "כדי להספיק".'},
{id:'a3',u:'u1',v:'tl-redyellow',q:'**אדום וצהוב** דולקים יחד. מה זה אומר?',o:['עוד רגע ירוק: מתכוננים אבל לא נוסעים','מותר כבר לנסוע','הרמזור מקולקל','צריך לפנות ימינה'],why:'אדום+צהוב = "מתכוננים". נוסעים רק כשנדלק ירוק.',more:'השלב הזה נותן לכם רגע להעביר להילוך ולהסתכל על הצומת. התנועה מותרת רק כשהאור הירוק נדלק.'},
{id:'a4',u:'u1',v:'tl-flash',q:'**צהוב מהבהב** ברמזור. מה המשמעות?',o:['נוסעים בזהירות ומצייתים לתמרורים ולזכות הקדימה','עוצרים עצירה מלאה תמיד','הדרך סגורה לתנועה','מותר לנסוע בלי להאט'],why:'צהוב מהבהב = הרמזור לא מכוון את הצומת. נוסעים לפי התמרורים בזהירות.',more:'כשהרמזור מהבהב בצהוב, זכות הקדימה נקבעת לפי התמרורים שליד הרמזור, ואם אין כאלה, לפי הכללים הרגילים (למשל, נותנים זכות קדימה למי שמימין).'},
{id:'a5',u:'u1',q:'צומת **בלי רמזור ובלי תמרורים**. למי זכות הקדימה?',o:['לרכב שמגיע **מימין**','לרכב שמגיע משמאל','לרכב הגדול יותר','למי שנוסע מהר יותר'],why:'בצומת לא מוסדר נותנים זכות קדימה למי שבא מימין.',more:'זה כלל ברירת המחדל. ברגע שיש רמזור, שוטר או תמרור (כמו "עצור" או "תן זכות קדימה"), הם קובעים, והכלל של "מימין" כבר לא חל.'},
{id:'a6',u:'u1',q:'מי קודם ב**כיכר**?',o:['הרכב שכבר נמצא בתוך הכיכר','הרכב שנכנס לכיכר','תמיד מי שמגיע מימין','מי שצופר ראשון'],why:'מי שכבר מסתובב בכיכר קודם. הנכנס ממתין.',more:'לפני הכניסה לכיכר מאטים, מסתכלים שמאלה (משם מגיעה התנועה בכיכר) ונכנסים רק כשיש רווח בטוח.'},
{id:'a7',u:'u1',q:'הולך רגל עומד לחצות ב**מעבר חציה** בלי רמזור. מה עושים?',o:['מאטים ונותנים לו לחצות','צופרים שיחכה','עוקפים אותו מהר','ממשיכים, כי לרכב יש זכות קדימה'],why:'במעבר חציה הולך הרגל קודם.',more:'מתקרבים למעבר חציה במהירות שמאפשרת לעצור. אם הולך רגל חוצה או עומד לחצות, עוצרים לפני המעבר ונותנים לו לעבור עד הסוף.'},
{id:'a8',u:'u1',q:'**אמבולנס** עם סירנה ואורות מהבהבים מגיע מאחור. מה עושים?',o:['מפנים לו דרך: זזים ימינה ועוצרים אם צריך','ממשיכים כרגיל','מאיצים לפניו','עוצרים מיד באמצע הנתיב'],why:'רכב הצלה בחירום מקבל דרך פנויה. זזים לצד ימין.',more:'מאותתים, זזים ימינה כמה שאפשר, ועוצרים רק אם צריך כדי לפנות את הדרך. לא נוסעים צמוד אחריו כדי "לנצל" את הדרך הפנויה.'},
{id:'a9',u:'u1',tf:1,q:'נכון או לא נכון: ברמזור ירוק אפשר להיכנס לצומת **גם אם אין מקום לצאת** ממנו.',o:TF,a:1,why:'אסור לחסום צומת. נכנסים רק כשיש מקום לצאת ממנו.',more:'אם התנועה אחרי הצומת עומדת, מחכים לפני הצומת גם כשהאור ירוק. כך לא תיתקעו באמצע ותחסמו את התנועה מהכיוונים האחרים.'},
{id:'a10',u:'u1',q:'פונים **שמאלה** בירוק, ורכב מולכם נוסע ישר. מי קודם?',o:['הרכב שנוסע ישר מולכם','אתם, כי אתם כבר בצומת','מי שגדול יותר','מי שאיתת ראשון'],why:'מי שפונה שמאלה נותן זכות קדימה לתנועה הנגדית.',more:'נכנסים למרכז הצומת, מחכים לרווח בתנועה שמגיעה מולכם, ומשלימים את הפנייה רק כשבטוח.'},
{id:'a11',u:'u1',q:'**שוטר** מכוון תנועה בצומת, והרמזור ירוק. למי מצייתים?',o:['לשוטר','לרמזור','למה שנראה בטוח יותר','לתמרור שבצד'],why:'הוראת שוטר גוברת על רמזור ותמרור.',more:'סדר העדיפויות: שוטר, אחריו רמזור, אחריו תמרור, ובסוף הכללים הכלליים.'},
{id:'a12',u:'u1',q:'מתי צריך **לאותת**?',o:['לפני פנייה, החלפת נתיב ויציאה מחניה','רק בלילה','רק כשיש רכב מאחור','רק בכביש בין-עירוני'],why:'מאותתים לפני כל שינוי כיוון, גם אם לא רואים אף אחד.',more:'האיתות נותן לאחרים זמן להבין מה אתם עומדים לעשות. מאותתים מראש, לא תוך כדי הפנייה, ומכבים את האיתות אחריה.'},
/* u2 */
{id:'b1',u:'u2',v:'stop',q:'מה אומר התמרור הזה?',o:['עוצרים עצירה מלאה ונותנים זכות קדימה','מאטים, ועוצרים רק אם יש רכבים','אסור לחנות כאן','סוף הדרך'],why:'"עצור" = עצירה מלאה לפני הקו, גם כשהדרך פנויה.',more:'עוצרים לגמרי (הרכב לא זז), מסתכלים לשני הצדדים, ונכנסים רק אחרי שנותנים זכות קדימה לכל התנועה בדרך החוצה.'},
{id:'b2',u:'u2',v:'yield',q:'מה אומר התמרור הזה?',o:['נותנים זכות קדימה לתנועה בדרך החוצה','עוצרים תמיד שלוש שניות','אין כניסה','כביש חד-סטרי'],why:'משולש הפוך = "תן זכות קדימה". עוצרים רק אם צריך.',more:'בניגוד ל"עצור", כאן לא חייבים לעצור כשהדרך פנויה. אבל אם מגיע רכב, הוא קודם, ואתם מחכים.'},
{id:'b3',u:'u2',v:'noentry',q:'מה אומר התמרור הזה?',o:['הכניסה אסורה לכל רכב','החניה אסורה','עצור','סוף אזור מגורים'],why:'עיגול אדום עם פס לבן = אין כניסה.',more:'רואים אותו בדרך כלל בקצה של רחוב חד-סטרי. אם תיכנסו, תיסעו נגד כיוון התנועה.'},
{id:'b4',u:'u2',v:'speed50',q:'מה אומר התמרור הזה?',o:['מהירות מרבית: 50 קמ"ש','מהירות מינימלית: 50 קמ"ש','עוד 50 מטר יש צומת','משקל מרבי: 50 טון'],why:'מספר בעיגול אדום = המהירות המרבית המותרת.',more:'זו התקרה, לא המטרה. בגשם, בחושך או בעומס נוסעים לאט יותר.'},
{id:'b5',u:'u2',v:'noparking',q:'מה אומר התמרור הזה?',o:['אסור לחנות (מותר לעצור להעלאה והורדה)','אסור לעצור ואסור לחנות','חניה בתשלום','חניה לנכים בלבד'],why:'פס אלכסוני אחד = אין חניה. עצירה קצרה מותרת.',more:'קל להתבלבל: קו אחד = אין חניה. איקס (שני קווים) = אין עצירה ואין חניה.'},
{id:'b6',u:'u2',v:'nostop',q:'מה אומר התמרור הזה?',o:['אסור לעצור ואסור לחנות','מותר לעצור עד דקה','חניה לאוטובוסים','אסור לפנות'],why:'איקס אדום = אסור לעצור וגם אסור לחנות.',more:'אפילו להוריד נוסע לרגע אסור כאן. זה ההבדל מתמרור "אין חניה" עם קו אחד.'},
{id:'b7',u:'u2',v:'roundabout',q:'מה אומר התמרור הזה?',o:['כיכר: נוסעים מסביב בכיוון החצים','חובה לפנות ימינה','מותר לבצע פרסה','אזור מגורים'],why:'עיגול כחול עם חצים במעגל = כיכר.',more:'בישראל נוסעים בכיכר נגד כיוון השעון, ונותנים זכות קדימה למי שכבר בתוכה.'},
{id:'b8',u:'u2',v:'straight',q:'מה אומר התמרור הזה?',o:['חובה לנסוע ישר','אסור לנסוע ישר','דרך ראשית','מותר לנסוע ישר רק בלילה'],why:'עיגול כחול עם חץ = הוראת חובה: נוסעים לכיוון החץ.',more:'תמרורים עגולים כחולים אומרים לכם מה חובה לעשות. כאן מותר רק להמשיך ישר.'},
{id:'b9',u:'u2',v:'warning',q:'מה אומר התמרור הזה?',o:['סכנה: מאטים ונזהרים','מותר לעקוף מכאן','סוף כל ההגבלות','תחנת עזרה ראשונה'],why:'משולש עם מסגרת אדומה = אזהרה מסכנה לפניכם.',more:'סימן קריאה במשולש מזהיר מסכנה כללית. לרוב יש מתחתיו שלט שמסביר מה הסכנה.'},
{id:'b10',u:'u2',v:'crosswalk',q:'מה אומר התמרור הזה?',o:['מעבר חציה להולכי רגל','אזור משחקים','תחנת אוטובוס','אסור להולכי רגל לעבור'],why:'ריבוע כחול עם הולך רגל = מעבר חציה.',more:'כשרואים אותו, מאטים ומוכנים לעצור. להולכי הרגל יש זכות קדימה במעבר.'},
{id:'b11',u:'u2',v:'nouturn',q:'מה אומר התמרור הזה?',o:['אסור לבצע פניית פרסה','אסור לפנות שמאלה','חובה לבצע פרסה','הכביש חסום'],why:'חץ פרסה עם קו אדום = פרסה אסורה.',more:'קו אדום על סמל אומר "אסור". כאן הסמל הוא פרסה, אז פרסה אסורה, אבל פנייה רגילה מותרת.'},
{id:'b12',u:'u2',q:'תמרור **עגול עם מסגרת אדומה** הוא בדרך כלל תמרור של…',o:['איסור','חובה','מידע','אזהרה'],why:'עיגול אדום = אסור. עיגול כחול = חובה. משולש = אזהרה.',more:'כדאי לזכור את הצורות: עיגול עם מסגרת אדומה אוסר, עיגול כחול מחייב, משולש מזהיר, וריבוע או מלבן נותן מידע.'},
{id:'b13',u:'u2',q:'תמרור **עגול כחול** הוא בדרך כלל תמרור של…',o:['חובה','איסור','אזהרה','חניה'],why:'כחול ועגול = מה חובה לעשות.',more:'למשל: חובה לנסוע ישר, חובה לפנות ימינה, כיכר.'},
{id:'b14',u:'u2',q:'תמרור **משולש עם מסגרת אדומה** (קודקוד למעלה) הוא תמרור של…',o:['אזהרה','איסור','חובה','מידע'],why:'משולש = "שימו לב, יש סכנה לפניכם".',more:'משולש הפוך (קודקוד למטה) הוא מקרה מיוחד: "תן זכות קדימה".'},
/* u3 */
{id:'c1',u:'u3',q:'מה המהירות המרבית ב**דרך עירונית** כשאין תמרור?',o:['50 קמ"ש','60 קמ"ש','70 קמ"ש','40 קמ"ש'],why:'בעיר, בלי תמרור אחר: עד 50 קמ"ש.',more:'תמרור יכול לקבוע מהירות אחרת (למשל 30 ליד בתי ספר). כשאין תמרור, 50 היא התקרה.'},
{id:'c2',u:'u3',q:'מהירות מרבית ב**דרך לא עירונית בלי שטח הפרדה**, כשאין תמרור?',o:['80 קמ"ש','90 קמ"ש','100 קמ"ש','70 קמ"ש'],why:'בין-עירוני, בלי הפרדה בין הכיוונים: עד 80.',more:'"שטח הפרדה" הוא מעקה או אי בנוי בין שני כיווני הנסיעה. בלעדיו הסכנה להתנגשות חזיתית גדולה יותר, ולכן המהירות נמוכה יותר.'},
{id:'c3',u:'u3',q:'ומה המהירות המרבית בדרך לא עירונית **עם שטח הפרדה בנוי**, כשאין תמרור?',o:['90 קמ"ש','80 קמ"ש','110 קמ"ש','100 קמ"ש'],why:'עם הפרדה בנויה: עד 90.',more:'בכבישים מהירים מסוימים התמרורים מתירים מהירות גבוהה יותר. בלי תמרור, הכלל הוא 90.'},
{id:'c4',u:'u3',q:'כמה מרחק שומרים מהרכב שלפניכם בתנאים רגילים?',o:['לפחות 2 שניות','חצי שנייה','מטר אחד','לא צריך, אם הכביש פנוי'],why:'כלל 2 השניות נותן זמן להגיב ולבלום.',more:'בוחרים נקודה בצד הדרך. כשהרכב שלפניכם עובר אותה, סופרים "אחת, אלף, שתיים, אלף". אם הגעתם אליה לפני שסיימתם, אתם קרובים מדי. בגשם ובלילה מגדילים את המרחק.'},
{id:'c5',u:'u3',q:'**גשם ראשון** אחרי תקופה יבשה. מה נכון?',o:['הכביש חלקלק במיוחד: מאטים ומגדילים מרחק','הכביש נקי ובטוח יותר','אפשר לנסוע מהר יותר, כי אין אבק','רק משאיות צריכות להאט'],why:'הגשם הראשון מערבב שמן ואבק על הכביש, והכביש נעשה חלקלק.',more:'דווקא הגשם הראשון של העונה מסוכן במיוחד. מאטים, לא בולמים בחדות ומשאירים מרחק גדול יותר מהרגיל.'},
{id:'c6',u:'u3',tf:1,q:'נכון או לא נכון: המספר בתמרור מהירות הוא המהירות שבה **חובה** לנסוע.',o:TF,a:1,why:'זו המהירות המרבית. נוסעים לפי התנאים, גם לאט יותר.',more:'בעומס, בגשם, בערפל או ליד ילדים, המהירות הנכונה יכולה להיות הרבה מתחת למספר בתמרור.'},
{id:'c7',u:'u3',q:'אם המהירות **מוכפלת** (למשל מ-40 ל-80), מרחק הבלימה…',o:['גדל בערך פי 4','גדל בערך פי 2','לא משתנה','קטן'],why:'מרחק הבלימה גדל לפי ריבוע המהירות: פי 2 במהירות = בערך פי 4 בבלימה.',more:'זו הסיבה שגם תוספת קטנה של מהירות מסוכנת: הדרך שהרכב צריך כדי לעצור גדלה הרבה יותר מהר מהמהירות עצמה.'},
{id:'c8',u:'u3',q:'נוסעים ב**ערפל** כבד. מה נכון?',o:['מאטים, מדליקים אורות נמוכים ומגדילים מרחק','מדליקים אורות גבוהים','נוסעים צמוד לרכב שלפניכם כדי לראות','עוצרים באמצע הנתיב'],why:'בערפל רואים פחות, לכן מאטים ומשתמשים באורות נמוכים.',more:'אורות גבוהים מוחזרים מהערפל ומסנוורים אתכם. אם הראות ממש אפסית, יוצאים מהכביש למקום בטוח ומחכים.'},
{id:'c9',u:'u3',q:'מאיזה צד עוקפים בדרך כלל?',o:['משמאל','מימין','מכל צד','דרך השוליים'],why:'עקיפה רגילה היא משמאל לרכב הנעקף.',more:'לפני עקיפה בודקים מראות ושטח מת, מאותתים, עוקפים, וחוזרים לנתיב רק כשרואים את הרכב שעקפתם במראה הפנימית.'},
{id:'c10',u:'u3',q:'**קו לבן רצוף** באמצע הכביש אומר…',o:['אסור לחצות אותו, ולכן אסור לעקוף דרכו','מותר לחצות אותו לעקיפה','מותר לחנות לידו','זה נתיב לאוטובוסים'],why:'קו רצוף = אסור לחצות.',more:'קו מקווקו מאפשר חצייה כשבטוח. קו רצוף מסמן מקום שבו חצייה מסוכנת, למשל לפני עיקול או עלייה.'},
{id:'c11',u:'u3',tf:1,q:'נכון או לא נכון: אסור לעקוף רכב **לפני מעבר חציה**.',o:TF,a:0,why:'הרכב שעוצר לפני המעבר יכול להסתיר הולך רגל שחוצה.',more:'אם רכב לפניכם האט ליד מעבר חציה, כנראה הוא עוצר בשביל הולך רגל שאתם לא רואים.'},
{id:'c12',u:'u3',q:'מה מאריך את **זמן התגובה** של נהג?',o:['עייפות, טלפון ואלכוהול','חגורת בטיחות','צמיגים חדשים','נסיעה ביום'],why:'כל דבר שמסיח את הדעת או מעייף מאט את התגובה.',more:'שנייה אחת של הסחת דעת ב-90 קמ"ש = 25 מטר שנסעתם בלי להסתכל על הכביש.'},
/* u4 */
{id:'d1',u:'u4',v:'curb-rw',q:'אבן שפה צבועה **אדום-לבן**. מה זה אומר?',o:['אסור לעצור ואסור לחנות','חניה בתשלום','חניה לאוטובוסים בלבד','מותר לחנות בלילה'],why:'אדום-לבן = לא עוצרים ולא חונים.',more:'אדום-לבן מסמן מקומות כמו פינות צומת או קטעים צרים, שבהם רכב עומד יחסום ראייה או תנועה.'},
{id:'d2',u:'u4',v:'curb-bw',q:'אבן שפה צבועה **כחול-לבן**. מה זה אומר?',o:['מותר לחנות לפי ההסדר (לרוב בתשלום)','אסור לחנות','חניה לאוטובוסים בלבד','חניה לאופנועים בלבד'],why:'כחול-לבן = חניה מותרת, לפי השלט או ההסדר במקום.',more:'בדרך כלל זו חניה בתשלום בשעות מסוימות. בודקים את השלט הסמוך כדי לדעת מתי ואיך משלמים.'},
{id:'d3',u:'u4',v:'curb-ry',q:'אבן שפה צבועה **אדום-צהוב**. מה זה אומר?',o:['המקום מיועד לסוג רכב מסוים בלבד (למשל אוטובוסים)','חניה חופשית לכולם','מקום לעצירת חירום','חניה רק בלילה'],why:'אדום-צהוב = עצירה וחניה רק לרכב שהמקום מיועד לו.',more:'למשל תחנת אוטובוס או מקום לרכב מורשה. כל רכב אחר לא עוצר ולא חונה שם.'},
{id:'d4',u:'u4',q:'מותר לחנות **על מעבר חציה**?',o:['לא, אסור לעצור או לחנות עליו','כן, לדקה','כן, בלילה','כן, עם אורות מהבהבים'],why:'רכב על מעבר חציה חוסם הולכי רגל ומסתיר אותם.',more:'אסור לעצור גם קצת לפני מעבר החציה, כי רכב חונה שם מסתיר ילדים והולכי רגל מעיני הנהגים.'},
{id:'d5',u:'u4',q:'באיזה צד של הכביש חונים בדרך כלל?',o:['בצד ימין, בכיוון התנועה','בצד שמאל, נגד כיוון התנועה','באמצע הכביש','בכל צד שנוח'],why:'חונים בצד ימין ובכיוון הנסיעה.',more:'ככה יוצאים מהחניה ישר לתוך הנתיב, בלי לחצות את התנועה הנגדית.'},
{id:'d6',u:'u4',q:'לפני ש**פותחים דלת** לצד הכביש…',o:['מסתכלים במראה ולאחור, לוודא שאין אופניים או רכב','פותחים מהר וסוגרים מהר','צופרים','פותחים רק בלילה'],why:'דלת שנפתחת פתאום היא סכנה גדולה לרוכבי אופניים.',more:'טיפ: פותחים את דלת הנהג עם היד הימנית. ככה הגוף מסתובב ורואים אוטומטית מה מגיע מאחור.'},
{id:'d7',u:'u4',q:'**יוצאים מחניה** לכביש. מי קודם?',o:['התנועה שבכביש. מאותתים ומחכים לרווח','אתם, כי איתתם','מי שגדול יותר','אתם, אם צפרתם'],why:'מי שיוצא מחניה נותן זכות קדימה לכל מי שכבר נוסע.',more:'איתות לא נותן לכם זכות קדימה. הוא רק מודיע לאחרים מה אתם מתכננים לעשות.'},
{id:'d8',u:'u4',q:'חונים **בעלייה**. מה עוזר שהרכב לא יתדרדר?',o:['בלם יד, הילוך משולב (או P) וסיבוב הגלגלים','רק לכבות את המנוע','להשאיר בניוטרל','להדליק אורות'],why:'בלם יד + הילוך + גלגלים מסובבים לאבן השפה = הרכב לא זז.',more:'גם אם בלם היד ישתחרר, הגלגלים המסובבים ייעצרו על אבן השפה במקום להתגלגל לכביש.'},
{id:'d9',u:'u4',tf:1,q:'נכון או לא נכון: מותר לחנות **בתחנת אוטובוס** אם הנהג נשאר ברכב.',o:TF,a:1,why:'תחנת אוטובוס שמורה לאוטובוסים, גם אם אתם ברכב.',more:'אוטובוס שלא יכול להיכנס לתחנה עוצר באמצע הכביש, והנוסעים יורדים לתוך התנועה.'},
{id:'d10',u:'u4',q:'מה ההבדל בין **עצירה** ל**חניה**?',o:['עצירה היא לזמן קצר, להעלאה או הורדה. חניה היא כל השארה מעבר לזה','אין הבדל','חניה זה רק בלילה','עצירה מותרת רק לרכב ציבורי'],why:'עצירה = לרגע, בשביל נוסע או מטען. חניה = כל עמידה אחרת.',more:'זה חשוב להבנת התמרורים: "אין חניה" עדיין מתיר עצירה קצרה, ו"אין עצירה" אוסר את שתיהן.'},
/* u5 */
{id:'e1',u:'u5',q:'מי חייב לחגור **חגורת בטיחות**?',o:['כל מי שנמצא ברכב','רק הנהג','רק מי שיושב מקדימה','רק בכביש בין-עירוני'],why:'כולם חוגרים, מקדימה ומאחור.',more:'נוסע לא חגור מאחור יכול להיזרק קדימה בתאונה ולפגוע בנהג. הנהג אחראי שכולם חגורים.'},
{id:'e2',u:'u5',q:'עד איזה גיל ילד חייב לשבת ב**מושב בטיחות או בוסטר** שמתאים לו?',o:['עד גיל 8','עד גיל 3','עד גיל 1','עד גיל 16'],why:'עד גיל 8 משתמשים במושב בטיחות או בוסטר שמתאים לגיל ולמשקל.',more:'חגורה רגילה מתאימה לגוף של מבוגר. לילד קטן היא עוברת על הצוואר והבטן, ובתאונה זה מסוכן. המושב מרים אותו לגובה הנכון.'},
{id:'e3',u:'u5',q:'**נהג חדש** או **נהג צעיר**. מה נכון לגבי אלכוהול?',o:['המגבלה כמעט אפס: גם משקה אחד יכול לעבור על החוק','מותרות 2 בירות','מותר אם מרגישים בסדר','אסור רק בלילה'],why:'לנהגים חדשים וצעירים המגבלה נמוכה מאוד. הכי פשוט: לא שותים בכלל לפני נהיגה.',more:'אצל נהג חדש או צעיר הסף נמוך פי כמה מאשר אצל נהג ותיק. כדאי לקבוע לעצמכם כלל: אם שתיתם, לא נוהגים.'},
{id:'e4',u:'u5',q:'מה **מוריד** אלכוהול מהדם?',o:['רק זמן','קפה','מקלחת קרה','ארוחה שמנה'],why:'הגוף מפרק אלכוהול בקצב קבוע. רק זמן עוזר.',more:'קפה או מקלחת יכולים לגרום לכם להרגיש ערניים יותר, אבל האלכוהול נשאר בדם וזמן התגובה עדיין איטי.'},
{id:'e5',u:'u5',q:'מרגישים **עייפות** בזמן נהיגה. מה עושים?',o:['עוצרים במקום בטוח ונחים','פותחים חלון ומגבירים מוזיקה','מאיצים כדי להגיע מהר','שותים משקה אנרגיה וממשיכים שעות'],why:'הפתרון היחיד לעייפות הוא מנוחה.',more:'סימנים לעייפות: פיהוקים, עיניים כבדות, סטייה מהנתיב, "קפיצה" של קילומטרים שלא זוכרים. ברגע שזה קורה, עוצרים.'},
{id:'e6',u:'u5',q:'**טלפון** בזמן נהיגה. מה נכון?',o:['אסור להחזיק אותו ביד. מותר דיבורית בלי לגעת','מותר להקליד ברמזור אדום','מותר לשלוח הודעה קצרה','מותר, אם נוסעים לאט'],why:'טלפון ביד = הסחת דעת. גם ברמזור אדום.',more:'קובעים ניווט לפני הנסיעה ושמים את הטלפון במתקן. הודעה יכולה לחכות.'},
{id:'e7',u:'u5',q:'הרכב נתקע ב**שול** של כביש בין-עירוני ויוצאים ממנו. מה עושים?',o:['לובשים אפוד זוהר ומציבים משולש אזהרה','עומדים ליד הדלת בצד הכביש','נשארים ברכב באמצע הנתיב','ביום לא צריך כלום'],why:'אפוד זוהר ומשולש אזהרה עוזרים לנהגים אחרים לראות אתכם בזמן.',more:'לובשים את האפוד עוד לפני שיוצאים, יוצאים מהצד הרחוק מהתנועה, ומחכים מאחורי המעקה אם יש.'},
{id:'e8',u:'u5',q:'מתי חובה לנסוע עם **אורות נמוכים ביום** בדרך בין-עירונית?',o:['מ-1 בנובמבר עד 31 במרץ','רק בקיץ','אף פעם','רק בסופי שבוע'],why:'בחורף, בדרך בין-עירונית, אורות נמוכים דולקים גם ביום.',more:'בחורף הראות נמוכה יותר, ואורות דולקים עוזרים לרכבים שמגיעים מולכם לראות אתכם מרחוק.'},
{id:'e9',u:'u5',q:'בלילה מגיע רכב **מולכם**, ואתם באורות גבוהים. מה עושים?',o:['עוברים לאורות נמוכים כדי לא לסנוור','משאירים אורות גבוהים','מכבים את האורות','מהבהבים לו כמה פעמים'],why:'אורות גבוהים מסנוורים את הנהג שמולכם.',more:'עוברים לנמוכים גם כשנוסעים מאחורי רכב אחר, כי האור שלכם מסנוור אותו דרך המראות.'},
{id:'e10',u:'u5',tf:1,q:'נכון או לא נכון: מותר להשאיר ילד **לבד ברכב** לכמה דקות אם החלונות סגורים.',o:TF,a:1,why:'רכב סגור מתחמם מהר מאוד. אף פעם לא משאירים ילד לבד.',more:'גם ביום לא חם במיוחד, הטמפרטורה ברכב סגור עולה לרמה מסוכנת תוך דקות. כדאי להרגיל את עצמכם להסתכל במושב האחורי בכל פעם שיוצאים מהרכב.'},
{id:'e11',u:'u5',q:'מה זה **השטח המת**?',o:['אזור ליד הרכב שלא רואים במראות. מציצים מעבר לכתף','המקום מאחורי תא המטען','השטח ליד הגלגלים','אזור בלי קליטה בטלפון'],why:'השטח המת לא נראה במראות, אז מציצים מעבר לכתף.',more:'לפני החלפת נתיב או יציאה מחניה: מראה, מבט מהיר מעבר לכתף, ורק אז זזים.'},

function sign(k){
  const tl=(r,y,g,blink)=>`<svg viewBox="0 0 100 100"><rect x="32" y="4" width="36" height="92" rx="12" fill="#232c38"/><circle cx="50" cy="24" r="11" fill="${r?'#ff3b3b':'#4a525e'}"/><circle cx="50" cy="50" r="11" class="${blink?'blink':''}" fill="${y?'#ffb81c':'#4a525e'}"/><circle cx="50" cy="76" r="11" fill="${g?'#2fd15a':'#4a525e'}"/></svg>`;
  const curb=(a,b)=>{let s='';for(let i=0;i<8;i++)s+=`<rect x="${i*25}" y="48" width="25" height="14" fill="${i%2?b:a}"/>`;return `<svg viewBox="0 0 200 100"><rect width="200" height="48" fill="#c9ced6"/><rect y="62" width="200" height="38" fill="#4b525c"/>${s}<rect y="96" width="200" height="0"/><rect x="20" y="80" width="30" height="4" fill="#e9edf2"/><rect x="90" y="80" width="30" height="4" fill="#e9edf2"/><rect x="160" y="80" width="30" height="4" fill="#e9edf2"/></svg>`};
  switch(k){
  case 'tl-red':return tl(1,0,0);
  case 'tl-yellow':return tl(0,1,0);
  case 'tl-redyellow':return tl(1,1,0);
  case 'tl-flash':return tl(0,1,0,1);
  case 'curb-rw':return curb(RED,'#ffffff');
  case 'curb-bw':return curb(BLUE,'#ffffff');
  case 'curb-ry':return curb(RED,'#ffc928');
  case 'stop':return `<svg viewBox="0 0 100 100"><polygon points="30.9,4 69.1,4 96,30.9 96,69.1 69.1,96 30.9,96 4,69.1 4,30.9" fill="#fff"/><polygon points="32.6,8.5 67.4,8.5 91.5,32.6 91.5,67.4 67.4,91.5 32.6,91.5 8.5,67.4 8.5,32.6" fill="${RED}"/><g fill="#fff"><rect x="36" y="46" width="30" height="30" rx="9"/><rect x="36" y="28" width="6.5" height="26" rx="3.2"/><rect x="44" y="23" width="6.5" height="30" rx="3.2"/><rect x="52" y="25" width="6.5" height="28" rx="3.2"/><rect x="60" y="31" width="6" height="22" rx="3"/><rect x="24" y="50" width="18" height="7" rx="3.5" transform="rotate(40 33 53)"/></g></svg>`;
  case 'yield':return `<svg viewBox="0 0 100 100"><polygon points="8,14 92,14 50,90" fill="#fff" stroke="${RED}" stroke-width="10" stroke-linejoin="round"/></svg>`;
  case 'noentry':return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${RED}"/><rect x="18" y="41" width="64" height="18" rx="2" fill="#fff"/></svg>`;
  case 'speed50':return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="#fff" stroke="${RED}" stroke-width="9"/><text x="50" y="63" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="38" fill="#111">50</text></svg>`;
  case 'noparking':return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="${BLUE}" stroke="${RED}" stroke-width="9"/><line x1="21" y1="21" x2="79" y2="79" stroke="${RED}" stroke-width="9"/></svg>`;
  case 'nostop':return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="${BLUE}" stroke="${RED}" stroke-width="9"/><line x1="21" y1="21" x2="79" y2="79" stroke="${RED}" stroke-width="9"/><line x1="79" y1="21" x2="21" y2="79" stroke="${RED}" stroke-width="9"/></svg>`;
  case 'roundabout':{const arc='<path d="M66.9 64.1 A22 22 0 0 0 66.9 35.9" fill="none" stroke="#fff" stroke-width="7"/><polygon points="60.5,28.5 73,31.5 62,41.5" fill="#fff"/>';return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${BLUE}"/><g>${arc}</g><g transform="rotate(120 50 50)">${arc}</g><g transform="rotate(240 50 50)">${arc}</g></svg>`}
  case 'straight':return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${BLUE}"/><rect x="43" y="42" width="14" height="38" fill="#fff"/><polygon points="50,16 74,46 26,46" fill="#fff"/></svg>`;
  case 'warning':return `<svg viewBox="0 0 100 100"><polygon points="50,10 93,86 7,86" fill="#fff" stroke="${RED}" stroke-width="8" stroke-linejoin="round"/><rect x="45.5" y="36" width="9" height="29" rx="4" fill="#111"/><circle cx="50" cy="74" r="5" fill="#111"/></svg>`;
  case 'crosswalk':return `<svg viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" rx="10" fill="${BLUE}"/><polygon points="50,14 88,84 12,84" fill="#fff"/><g fill="#111"><rect x="26" y="76" width="9" height="5"/><rect x="40" y="76" width="9" height="5"/><rect x="54" y="76" width="9" height="5"/><rect x="68" y="76" width="7" height="5"/><circle cx="52" cy="38" r="5"/></g><path d="M51 45 L47 58 L41 70 M47 58 L56 70 M49 49 L42 55 M50 49 L59 53" stroke="#111" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg>`;
  case 'nouturn':return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="#fff" stroke="${RED}" stroke-width="9"/><path d="M62 76 V44 a12 12 0 0 0 -24 0 V58" stroke="#111" stroke-width="8" fill="none"/><polygon points="28,56 48,56 38,70" fill="#111"/><line x1="22" y1="22" x2="78" y2="78" stroke="${RED}" stroke-width="8"/></svg>`;
  }
  return '';
}

  return `<svg class="mascot" width="${size}" height="${size*1.12}" viewBox="0 0 120 134" aria-hidden="true">
   <ellipse cx="60" cy="128" rx="30" ry="5" fill="#000" opacity=".12"/>

   <circle cx="34" cy="68" r="5" fill="#ff8f8f" opacity=".55"/><circle cx="86" cy="68" r="5" fill="#ff8f8f" opacity=".55"/>
   ${mouth}
   <rect x="34" y="88" width="52" height="18" rx="9" fill="#1d2633"/>
   <circle cx="45" cy="97" r="5.5" fill="${on('r')?'#ff4545':'#5a2a2e'}"/><circle cx="60" cy="97" r="5.5" fill="${mood==='cheer'?'#ffbf2e':'#5d4a1c'}"/><circle cx="75" cy="97" r="5.5" fill="${on('g')?'#34d460':'#1f4a2c'}"/>
   <rect x="38" y="114" width="14" height="10" rx="5" fill="#2e3a4b"/><rect x="68" y="114" width="14" height="10" rx="5" fill="#2e3a4b"/>
  </svg>`;
}

const KEY='ramzi-theory-v1';
const DEF=()=>({name:'',xp:0,streak:0,lastDay:null,day:null,dayXp:0,goal:20,done:{},wrong:[],answered:0,correct:0,exams:[],sound:true});
let S;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||'{}')||{})}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)};
function rollDay(){const t=dayStr();if(S.day!==t){S.day=t;S.dayXp=0}if(S.lastDay&&S.lastDay!==t&&S.lastDay!==yesterday())S.streak=0;save()}
function addXP(n){rollDay();const t=dayStr();if(S.lastDay!==t){S.streak=(S.lastDay===yesterday()?S.streak:0)+1;S.lastDay=t}S.xp+=n;S.dayXp+=n;save();renderTop()}
function markWrong(id,bad){const i=S.wrong.indexOf(id);if(bad&&i<0)S.wrong.push(id);if(!bad&&i>=0)S.wrong.splice(i,1)}
rollDay();

/* ================= FX ================= */
let AC=null;
function beep(seq){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+.01;seq.forEach(([f,st,du,type,vol])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(vol||.12,t0+st+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+st+du);o.connect(g);g.connect(AC.destination);o.start(t0+st);o.stop(t0+st+du+.03)})}catch(e){}}
const SND={ok:()=>beep([[660,0,.12],[990,.09,.2]]),bad:()=>beep([[230,0,.22,'triangle',.16],[175,.12,.28,'triangle',.13]]),win:()=>beep([[523,0,.16],[659,.12,.16],[784,.24,.16],[1047,.36,.4]]),tap:()=>beep([[520,0,.05,'sine',.04]])};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function speak(text){try{if(!('speechSynthesis' in window))throw 0;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(text));u.lang='he-IL';u.rate=.95;speechSynthesis.speak(u)}catch(e){toast('הקראה לא זמינה במכשיר הזה')}}
function confetti(){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const c=$('#confetti'),x=c.getContext('2d'),d=window.devicePixelRatio||1;const W=c.width=innerWidth*d,H=c.height=innerHeight*d;c.style.display='block';
  const cols=['#22a447','#f2a516','#1769d1','#e0464b','#0f9f95','#ffd23f'];
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.38,vx:(Math.random()-.5)*15*d,vy:(-Math.random()*15-5)*d,r:(4+Math.random()*5)*d,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45*d;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<160)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.style.display='none'}})();
}
function confirmSheet({title,text,ok,cancel,onOk}){
  const m=$('#modal');
  m.innerHTML=`<div class="scrim"></div><div class="dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><button class="btn btn-primary" data-k="cancel">${esc(cancel)}</button><button class="btn btn-ghost danger" data-k="ok">${esc(ok)}</button></div>`;
  m.hidden=false;
  m.onclick=e=>{const k=e.target.closest('[data-k]');if(e.target.classList.contains('scrim')||(k&&k.dataset.k==='cancel'))m.hidden=true;else if(k&&k.dataset.k==='ok'){m.hidden=true;onOk()}};
}

function ring(p){const r=28,c=2*Math.PI*r;return `<svg class="ready-ring" viewBox="0 0 68 68"><circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--blue)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 34 34)"/><text x="34" y="40" text-anchor="middle" font-family="Fredoka,Heebo,sans-serif" font-weight="700" font-size="17" fill="var(--ink)">${Math.round(p*100)}%</text></svg>`}
function vPath(){
  const doneN=ALL_LESSONS.filter(l=>S.done[l.id]).length;
  let h=`<div class="ready">${ring(doneN/ALL_LESSONS.length)}<div><h3>המוכנות שלכם למבחן</h3><p>${doneN} מתוך ${ALL_LESSONS.length} שיעורים · המבחן: 30 שאלות, 40 דקות, עד 4 טעויות</p></div></div>`;
  const offs=[0,-62,-34,40];
  let globalCur=null;
  for(const u of UNITS){for(let i=0;i<u.lessons.length;i++){const l=u.lessons[i];if(!S.done[l.id]&&(i===0||S.done[u.lessons[i-1].id])){globalCur=l.id;break}}if(globalCur)break}
  UNITS.forEach((u,ui)=>{
    const dn=u.lessons.filter(l=>S.done[l.id]).length;
    h+=`<section class="unit" style="--uc:var(--${u.c});--ucd:var(--${u.c}-d)"><div class="unit-head"><div><div class="unit-eyebrow">יחידה ${ui+1}</div><h2>${u.title}</h2><p>${u.sub}</p></div><div class="unit-count">${dn}/${u.lessons.length}</div></div><div class="nodes">`;
    u.lessons.forEach((l,li)=>{
      const open=li===0||!!S.done[u.lessons[li-1].id],done=!!S.done[l.id],cur=l.id===globalCur;
      const cls=['node',done?'done':(!open?'locked':''),l.type==='review'?'review':''].join(' ');
      const ico=done?IC.check:(!open?IC.lock:(l.type==='review'?IC.trophy:(cur?IC.star:IC.book)));
      const off=offs[li%offs.length];
      h+=`<div class="node-row ${cur?'current':''}" style="transform:translateX(${off}px)">${cur?'<div class="start-tip">התחילו</div>':''}<button class="${cls}" data-l="${l.id}" aria-label="${u.title}: ${l.title}${done?' (הושלם)':!open?' (נעול)':''}">${ico}</button><div class="node-label">${l.title}</div>${cur?`<div class="side-mascot bob" style="${off<=0?'left:auto;right:-130px':'right:auto;left:-130px'}">${mascot('happy',84)}</div>`:''}</div>`;
    });
    h+='</div></section>';
  });
  return h;
}

    if(i>0&&!S.done[u.lessons[i-1].id]){buzz(30);toast('קודם מסיימים את '+u.lessons[i-1].title);return}

function startSession(o){
  L=Object.assign(o,{queue:o.ids.slice(),total:o.ids.length,solved:0,wrongSet:new Set(),combo:0,t0:Date.now(),cur:null,sel:null,checked:false,removed:new Set()});

}
function nextQ(){
  if(!L.queue.length)return finishSession();
  L.cur=QBY[L.queue.shift()];L.sel=null;L.checked=false;L.removed=new Set();
  L.order=L.cur.tf?[0,1]:shuffle(L.cur.o.map((_,i)=>i));

}
function lsTop(){return `<div class="ls-top gut"><button class="icon-btn" id="lsClose" aria-label="יציאה מהשיעור">${IC.x}</button><div class="bar"><div class="fill" id="lsFill" style="width:${L.solved/L.total*100}%"></div></div><div class="combo" id="combo">${L.combo>=3?IC.flame+L.combo:''}</div></div>`}
function renderLesson(){
  const q=L.cur,again=L.wrongSet.has(q.id),n=Math.min(L.solved+1,L.total);
  const vis=q.v?`<div class="visual ${q.v.startsWith('curb')?'wide':''}">${sign(q.v)}</div>`:'';
  $('#lesson').innerHTML=`<div class="sheet-inner">${lsTop()}
   <div class="ls-body gut"><div class="ls-meta"><span class="ls-unit">${esc(L.label)}${again?'<span class="again">חזרה</span>':''}</span><span class="ls-count">שאלה ${n}/${L.total}</span></div>
    ${vis}<h1 class="ls-q" id="qText">${fmt(q.q)}</h1>
    <div class="tools"><button class="tool" id="spk">${IC.speak}הקראה</button>${q.tf?'':`<button class="tool" id="hint">${IC.bulb}רמז: מחיקת תשובה</button>`}</div>
    <div class="opts" role="radiogroup">${L.order.map((oi,k)=>`<button class="opt" role="radio" aria-checked="false" data-o="${oi}"><span class="num">${k+1}</span><span>${fmt(q.o[oi])}</span></button>`).join('')}</div>
   </div>
   <div class="ls-foot gut"><button class="btn btn-green" id="checkBtn" disabled>בדיקה</button></div></div>`;
  $('#lsClose').onclick=()=>confirmSheet({title:'לצאת מהשיעור?',text:'ההתקדמות בשיעור הזה לא תישמר.',cancel:'להמשיך ללמוד',ok:'יציאה',onOk:closeLesson});
  $('#spk').onclick=()=>speak(q.q+'. '+L.order.map((oi,k)=>(k+1)+'. '+q.o[oi]).join('. '));
  const h=$('#hint');if(h)h.onclick=()=>{const wrongs=L.order.filter(i=>i!==q.a&&!L.removed.has(i)&&i!==L.sel);if(L.removed.size>=1||!wrongs.length){return}const r=wrongs[Math.random()*wrongs.length|0];L.removed.add(r);const b=$(`.opt[data-o="${r}"]`);b.classList.add('gone');b.disabled=true;h.disabled=true;SND.tap()};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  $('#checkBtn').onclick=check;
  $('#lesson .ls-body').scrollTop=0;
}
function pick(i){
  if(L.checked||L.removed.has(i))return;SND.tap();L.sel=i;
  document.querySelectorAll('.opt').forEach(b=>{const on=+b.dataset.o===i;b.classList.toggle('sel',on);b.setAttribute('aria-checked',on)});
  $('#checkBtn').disabled=false;
}
function check(){
  if(L.sel==null||L.checked)return;L.checked=true;
  const q=L.cur,ok=L.sel===q.a;
  S.answered++;if(ok)S.correct++;markWrong(q.id,!ok);save();
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const o=+b.dataset.o;if(o===q.a)b.classList.add('right');else if(o===L.sel)b.classList.add('wrong','shake');b.classList.remove('sel')});
  if(ok){L.solved++;L.combo++;SND.ok();buzz(15)}else{L.combo=0;L.wrongSet.add(q.id);L.queue.push(q.id);SND.bad();buzz([40,40,40])}
  $('#lsFill').style.width=(L.solved/L.total*100)+'%';
  $('#combo').innerHTML=L.combo>=3?IC.flame+L.combo:'';
  const fb=document.createElement('div');fb.className='fb '+(ok?'ok':'bad');fb.setAttribute('role','alert');
  fb.innerHTML=`<div class="fb-in gut">
   <div class="fb-head"><div class="fb-ico" style="color:var(${ok?'--green':'--red'})">${ok?IC.check:IC.x}</div><h3>${ok?(L.combo>=3?L.combo+' ברצף! '+PRAISE[Math.random()*PRAISE.length|0]:PRAISE[Math.random()*PRAISE.length|0]):'לא נורא, ככה לומדים.'}</h3></div>
   ${ok?'':`<p>התשובה הנכונה: <b>${fmt(q.o[q.a])}</b></p>`}
   <p><b>למה?</b> ${fmt(q.why)}</p>
   <button class="more-btn" aria-expanded="false" id="moreBtn">הסבר מורחב ${IC.chev}</button>
   <div class="more" id="moreTxt" hidden>${fmt(q.more)}</div>
   ${ok?'':`<div class="note">↻ נחזור לשאלה הזו בסוף השיעור</div>`}
   <button class="btn ${ok?'btn-green':'btn-red'}" id="contBtn">המשך</button></div>`;
  $('#lesson .sheet-inner').appendChild(fb);
  $('#lesson .ls-foot').style.visibility='hidden';
  $('#moreBtn').onclick=e=>{const t=$('#moreTxt');t.hidden=!t.hidden;e.currentTarget.setAttribute('aria-expanded',!t.hidden)};
  $('#contBtn').onclick=nextQ;$('#contBtn').focus({preventScroll:true});
}
function finishSession(){
  const secs=Math.round((Date.now()-L.t0)/1000),acc=Math.round((L.total-L.wrongSet.size)/L.total*100);
  let xp;
  if(L.mode==='lesson'){xp=10+(L.wrongSet.size===0?5:0);S.done[L.lesson.id]=true}else xp=L.total;
  addXP(xp);save();SND.win();buzz([20,60,20]);confetti();
  const perfect=L.wrongSet.size===0;
  $('#lesson').innerHTML=`<div class="sheet-inner gut"><div class="done-screen">
    <div class="bob">${mascot('cheer',140)}</div>
    <h1>${L.mode==='lesson'?'השיעור הושלם!':'התרגול הושלם!'}</h1>
    <p class="muted" style="margin:0;font-size:17px">${perfect?'בלי אף טעות. מושלם.':'כל טעות שתיקנתם היום היא שאלה שתדעו במבחן.'}</p>
    <div class="done-tiles">
     <div class="dt" style="--tc:var(--amber)"><b>XP</b><div dir="ltr">+${xp}</div></div>
     <div class="dt" style="--tc:var(--green)"><b>דיוק</b><div>${acc}%</div></div>
     <div class="dt" style="--tc:var(--blue)"><b>זמן</b><div>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div></div>
    </div></div>
    <div style="padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))"><button class="btn btn-primary" id="doneBtn">המשך</button></div></div>`;
  $('#doneBtn').onclick=closeLesson;
}
function closeLesson(){try{speechSynthesis.cancel()}catch(e){}$('#lesson').hidden=true;$('#lesson').innerHTML='';L=null;render()}

/* ================= EXAM ENGINE ================= */
let E=null;
function pickExam(n){
  const pools=UNITS.map(u=>shuffle(Q.filter(q=>q.u===u.id).map(q=>q.id)));const out=[];
  while(out.length<n&&pools.some(p=>p.length))for(const p of shuffle(pools)){if(p.length&&out.length<n)out.push(p.pop())}
  return shuffle(out);
}
function startExam(){
  const ids=pickExam(30);
  E={ids,ans:Array(ids.length).fill(null),orders:ids.map(id=>QBY[id].tf?[0,1]:shuffle(QBY[id].o.map((_,i)=>i))),idx:0,t0:Date.now(),end:Date.now()+40*60*1000};
  E.timer=setInterval(tickExam,1000);$('#exam').hidden=false;renderExam();
}
function tLeft(){return Math.max(0,Math.round((E.end-Date.now())/1000))}
function tickExam(){if(!E)return;const s=tLeft(),t=$('#exTimer');if(t){t.lastChild.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');t.classList.toggle('low',s<300)}if(s<=0)finishExam(true)}
function renderExam(){
  const id=E.ids[E.idx],q=QBY[id],s=tLeft(),N=E.ids.length;
  $('#exam').innerHTML=`<div class="sheet-inner">
   <div class="ls-top gut"><button class="icon-btn" id="exClose" aria-label="יציאה מהמבחן">${IC.x}</button><div style="flex:1;font-weight:700" class="ls-count">שאלה ${E.idx+1}/${N}</div><div class="timer ${s<300?'low':''}" id="exTimer">${IC.clock}<span>${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</span></div></div>
   <div class="gut"><div class="strip" id="strip">${E.ids.map((_,i)=>`<button class="dot ${E.ans[i]!=null?'ans':''} ${i===E.idx?'cur':''}" data-i="${i}" aria-label="שאלה ${i+1}">${i+1}</button>`).join('')}</div></div>
   <div class="ls-body gut">${q.v?`<div class="visual ${q.v.startsWith('curb')?'wide':''}">${sign(q.v)}</div>`:''}
    <h1 class="ls-q">${fmt(q.q)}</h1>
    <div class="opts" role="radiogroup">${E.orders[E.idx].map((oi,k)=>`<button class="opt ${E.ans[E.idx]===oi?'sel':''}" role="radio" aria-checked="${E.ans[E.idx]===oi}" data-o="${oi}"><span class="num">${k+1}</span><span>${fmt(q.o[oi])}</span></button>`).join('')}</div></div>
   <div class="ls-foot gut ex-nav"><button class="btn btn-outline" id="exPrev" ${E.idx===0?'disabled':''}>הקודמת</button>${E.idx===N-1?'<button class="btn btn-green" id="exFinish">סיום המבחן</button>':'<button class="btn btn-primary" id="exNext">הבאה</button>'}</div></div>`;
  $('#exClose').onclick=()=>confirmSheet({title:'לצאת מהמבחן?',text:'המבחן לא יישמר ולא ייספר.',cancel:'להמשיך במבחן',ok:'יציאה',onOk:closeExam});
  document.querySelectorAll('#exam .opt').forEach(b=>b.onclick=()=>{SND.tap();E.ans[E.idx]=+b.dataset.o;document.querySelectorAll('#exam .opt').forEach(x=>{const on=x===b;x.classList.toggle('sel',on);x.setAttribute('aria-checked',on)});$(`.dot[data-i="${E.idx}"]`).classList.add('ans')});
  document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{E.idx=+b.dataset.i;renderExam()});
  $('#exPrev').onclick=()=>{if(E.idx>0){E.idx--;renderExam()}};
  const nx=$('#exNext');if(nx)nx.onclick=()=>{E.idx++;renderExam()};
  const fn=$('#exFinish');if(fn)fn.onclick=()=>{const left=E.ans.filter(a=>a==null).length;if(left)confirmSheet({title:'לסיים את המבחן?',text:`נשארו ${left} שאלות בלי תשובה. הן ייספרו כטעויות.`,cancel:'לחזור לשאלות',ok:'סיום המבחן',onOk:()=>finishExam(false)});else finishExam(false)};
  const d=$('.dot.cur');if(d)d.scrollIntoView({inline:'center',block:'nearest'});
}
function finishExam(auto){
  if(!E||E.finished)return;E.finished=true;clearInterval(E.timer);
  const N=E.ids.length;let c=0;const mist=[];
  E.ids.forEach((id,i)=>{const q=QBY[id],a=E.ans[i];S.answered++;if(a===q.a){c++;S.correct++;markWrong(id,false)}else{markWrong(id,true);mist.push({q,a})}});
  const pass=N-c<=4,secs=Math.round((Date.now()-E.t0)/1000);
  S.exams.push({d:dayStr(),c,n:N,p:pass,t:Math.min(secs,2400)});save();addXP(pass?20:10);
  if(pass){SND.win();confetti()}else SND.bad();
  $('#exam').innerHTML=`<div class="sheet-inner"><div class="ls-top gut"><button class="icon-btn" id="exClose" aria-label="סגירה">${IC.x}</button><div style="flex:1"></div></div>
   <div class="ls-body gut">
    <div class="result-hero ${pass?'pass':'fail'}">${mascot(pass?'cheer':'sad',110)}<h1>${pass?'עברתם!':'הפעם לא עברתם'}</h1><div class="score">${c}/${N}</div><p class="muted" style="margin:0">${auto?'הזמן נגמר. ':''}${N-c} טעויות · מותר עד 4 · ${Math.floor(secs/60)} דקות</p></div>
    ${mist.length?`<h2 class="section-title">הטעויות שלכם</h2><p class="muted" style="margin:-10px 0 0">השאלות האלה נוספו ל"הטעויות שלי" בתרגול.</p>`+mist.map(({q,a})=>`<div class="card mistake">${q.v?`<div class="visual ${q.v.startsWith('curb')?'wide':''}" style="width:96px;height:96px;padding:8px;align-self:flex-start">${sign(q.v)}</div>`:''}<div class="q">${fmt(q.q)}</div><div class="a bad">✗ ${a==null?'לא עניתם':fmt(q.o[a])}</div><div class="a good">✓ ${fmt(q.o[q.a])}</div><div class="why">${fmt(q.why)}</div></div>`).join(''):'<div class="card" style="text-align:center"><b>אפס טעויות. מושלם!</b></div>'}
   </div>
   <div class="ls-foot gut"><button class="btn btn-primary" id="exDone">חזרה למבחנים</button></div></div>`;
  $('#exClose').onclick=closeExam;$('#exDone').onclick=closeExam;
}
function closeExam(){if(E)clearInterval(E.timer);E=null;$('#exam').hidden=true;$('#exam').innerHTML='';render()}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')$('#modal').hidden=true;return}
  if(L&&!$('#lesson').hidden){
    const n=+e.key;if(n>=1&&n<=4&&!L.checked&&L.order[n-1]!=null){pick(L.order[n-1]);return}
    if(e.key==='Enter'){e.preventDefault();if(!L.checked){if(L.sel!=null)check()}else{const c=$('#contBtn');if(c)c.click()}}
  }else if(E&&!$('#exam').hidden&&!E.finished){
    const n=+e.key;if(n>=1&&n<=4){const b=document.querySelectorAll('#exam .opt')[n-1];if(b)b.click()}
    if(e.key==='ArrowLeft'&&E.idx<E.ids.length-1){E.idx++;renderExam()}
    if(e.key==='ArrowRight'&&E.idx>0){E.idx--;renderExam()}
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollDay();renderTop()}});

render();
})();
</script>
